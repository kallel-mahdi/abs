env:
  name: Pendulum-v1
  discount: 0.99
  reward_scale: 800.0
  normalize_obs: false
  features: pendulum
  action_scale: 2.0
search:
  iterations: 130
  queries: 4
  episodes: 5
  sigma: 0.02
  learning_rate: 0.005
gp:
  center_episodes: 5
  n_max: 5
  lengthscale_bounds: [0.0025, 0.05]
  constant_mean: false
  fit_mean: pointwise
critic:
  aggregation: softmax
  reset_worst: true
