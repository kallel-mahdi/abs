env:
  name: Walker2d-v5
  kwargs: {xml_file: walker2d.xml}  # v4's model: left-foot friction 0.9, not 1.9
  discount: 0.99
  reward_scale: 300.0
  normalize_obs: true
search:
  iterations: 1000
  queries: 24
  episodes: 1
  sigma: 0.025
  learning_rate: 0.01
gp:
  center_episodes: 5
  n_max: 75
  lengthscale_bounds: [0.000625, 0.0125]
  constant_mean: true
