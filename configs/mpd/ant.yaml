env:
  name: Ant-v5
  kwargs: {include_cfrc_ext_in_observation: false, contact_cost_weight: 0.0}  # v4's observation and reward
  discount: 0.99
  reward_scale: 400.0
  normalize_obs: true
search:
  iterations: 1000
  queries: 24
  episodes: 1
  sigma: 0.025
  learning_rate: 0.01
gp:
  center_episodes: 5
  n_max: 75
  lengthscale_bounds: [0.000625, 0.0125]
  constant_mean: true
