[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "abps"
version = "1.0.0"
description = "Augmented Bayesian Policy Search (ICLR 2024)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "jax>=0.12,<0.13",
  "flax>=0.12.10,<0.13",
  "optax>=0.2.8,<0.3",
  "orbax-checkpoint>=0.12.8,<0.13",
  "gymnasium[mujoco]>=1.4,<2",
  "numpy>=2.3",
  "pyyaml>=6",
  "tyro>=1.0.16",
  "wandb>=0.20",
]

[project.urls]
Repository = "https://github.com/kallel-mahdi/abs"

[project.scripts]
abps-train = "abps.experiment.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
figures = ["pandas>=2.2", "matplotlib>=3.9", "seaborn>=0.13", "jupyter>=1"]
cuda = ["jax[cuda12]>=0.12,<0.13"]

[tool.uv]
default-groups = ["dev", "cuda"]

[tool.setuptools.packages.find]
include = ["abps", "abps.*"]

[tool.ruff]
target-version = "py312"
cache-dir = "~/.cache/ruff"
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",  # PEP 8, likely bugs, imports, modern syntax, simplifications
  "NPY", "PIE", "RET", "PERF", "PTH", "FURB", "PT",  # NumPy, needless code, returns, slow loops, pathlib, tests
  "PLW", "ICN", "ERA", "PGH",  # loop-variable overwrites, import aliases, commented-out code, blanket noqa
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # the formatter wraps lines; docstrings write maths in Unicode
isort.split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true  # collapse calls that fit on a line

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -p no:cacheprovider"
